services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: app_db
    volumes:
      - pg_local_data:/var/lib/postgresql/data
    networks:
      - internal_network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: local_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://dev_user:dev_password@postgres:5432/app_db?schema=public&sslmode=disable"
      PORT: 8080
      GIN_MODE: debug
      JWT_SECRET: "dev-secret-key-change-this-in-production"
      JWT_EXPIRY_HOURS: "12"
      CORS_ORIGIN: "http://localhost:3000"
      INITIAL_ADMIN_PASSWORD: "Admin@12345"
      BCRYPT_COST: "10"
      ASSETBASE_DEMO_SEED: "true"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy # Đợi DB chuyển trạng thái healthy mới bật backend
    ports:
      - "8080:8080"
    networks:
      - internal_network

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: local_frontend
    restart: unless-stopped
    ports:
      - "3000:8080" # Container listen port 8080 (nginx-unprivileged), map ra port 3000 ngoài máy
    depends_on:
      - backend
    networks:
      - internal_network

volumes:
  pg_local_data:
  backend_uploads:

networks:
  internal_network:
    driver: bridge