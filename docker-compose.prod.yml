services:
  postgres:
    image: postgres:16-alpine
    container_name: prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    networks:
      - internal_network
    # Không expose port 5432 ra host!

  backend:
    image: ${DOCKER_USERNAME}/assetflow-api:latest
    container_name: prod_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&sslmode=disable"
      PORT: 8080
      GIN_MODE: release
    volumes:
      - prod_uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - internal_network

  frontend:
    image: ${DOCKER_USERNAME}/assetflow-web:latest
    container_name: prod_frontend
    restart: always
    ports:
      - "80:8080" # Map cổng 80 công khai của EC2 vào cổng 8080 của Nginx unprivileged
    depends_on:
      - backend
    networks:
      - internal_network

volumes:
  pg_prod_data:
  prod_uploads:

networks:
  internal_network:
    driver: bridge